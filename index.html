<!doctype html>
<html lang="en">

    <meta name="color-scheme" content="dark" />
    <!-- Force sRGB so colors render identically across Chrome, Edge, Firefox -->
    <meta name="supported-color-schemes" content="dark" />

    <!-- Primary Meta -->
    <title>Billu · Video Editor and Colorist</title>

    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://billu.works/" />
    <meta property="og:title"       content="Billu · Video Editor and Colorist" />
    <meta property="og:description" content="I edit and color-grade TV commercials. 20 years, 300+ spots, based in Karachi." />
    <meta property="og:image"       content="https://billu.works/images/og-card.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card"       content="summary_large_image" />
    <meta name="twitter:title"      content="Billu · Video Editor and Colorist" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="fonts-loading">
    <div id="root"></div>
    <script>
      // Remove fonts-loading class once all custom fonts are ready (prevents FOUT)
      document.fonts.ready.then(function() { document.body.classList.remove('fonts-loading') })
    </script>
    <script type="module" src="/src/main.jsx"></script>
